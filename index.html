<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M4DI~UciH4 ⚡ Universal Portal</title>
  <meta name="description" content="M4DI~UciH4 Universal Portal — XAUUSD Scalping Pro & IPTV Streamix in one place">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070a;
      --surface: rgba(12, 16, 24, 0.75);
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.15);
      --trade-c1: #d4af37;
      --trade-c2: #f0b429;
      --trade-glow: rgba(240,180,41,0.35);
      --stream-c1: #6366f1;
      --stream-c2: #06b6d4;
      --stream-glow: rgba(99,102,241,0.35);
      --text: #e2e8f0;
      --text2: rgba(255,255,255,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ═══ AMBIENT BG ═══ */
    .ambient {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .ambient::before {
      content: '';
      position: absolute;
      top: -40%; left: -10%;
      width: 50%; height: 80%;
      background: radial-gradient(ellipse, var(--trade-glow) 0%, transparent 70%);
      opacity: 0.5;
      transition: opacity 0.8s ease, background 0.8s ease;
      animation: ambientFloat 12s ease-in-out infinite alternate;
    }
    .ambient::after {
      content: '';
      position: absolute;
      bottom: -30%; right: -10%;
      width: 45%; height: 70%;
      background: radial-gradient(ellipse, rgba(99,102,241,0.15) 0%, transparent 70%);
      opacity: 0.4;
      animation: ambientFloat2 14s ease-in-out infinite alternate;
    }
    body.mode-stream .ambient::before {
      background: radial-gradient(ellipse, var(--stream-glow) 0%, transparent 70%);
    }
    @keyframes ambientFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 8%) scale(1.1); }
    }
    @keyframes ambientFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-6%, -5%) scale(1.15); }
    }

    /* ═══ IFRAME CONTAINERS ═══ */
    .frame-wrap {
      position: fixed;
      inset: 0;
      transition: opacity 0.55s cubic-bezier(0.4,0,0.2,1), transform 0.55s cubic-bezier(0.4,0,0.2,1);
      will-change: opacity, transform;
    }
    .frame-wrap iframe {
      width: 100%; height: 100%;
      border: none; outline: none;
      background: var(--bg);
    }

    /* Default: Trading visible */
    .frame-trading { z-index: 2; opacity: 1; transform: scale(1); }
    .frame-stream  { z-index: 1; opacity: 0; transform: scale(0.97) translateY(15px); pointer-events: none; }

    /* Stream mode */
    body.mode-stream .frame-trading {
      z-index: 1; opacity: 0; transform: scale(0.97) translateY(-15px); pointer-events: none;
    }
    body.mode-stream .frame-stream {
      z-index: 2; opacity: 1; transform: scale(1) translateY(0); pointer-events: all;
    }

    /* ═══ FLOATING NAV — Auto-collapse pill ═══ */
    .nav-trigger {
      position: fixed;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tiny floating dot (always visible) */
    .nav-dot {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      font-size: 15px;
      z-index: 3;
      position: relative;
    }
    .nav-dot::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--trade-c1), var(--trade-c2), var(--trade-c1));
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s;
    }
    body.mode-stream .nav-dot::after {
      background: conic-gradient(from 0deg, var(--stream-c1), var(--stream-c2), var(--stream-c1));
    }
    .nav-trigger:hover .nav-dot::after,
    .nav-trigger.expanded .nav-dot::after { opacity: 1; }
    .nav-trigger:hover .nav-dot,
    .nav-trigger.expanded .nav-dot {
      transform: scale(1.1);
      border-color: transparent;
    }

    /* Expanded panel */
    .nav-panel {
      position: absolute;
      top: 46px;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
      opacity: 0;
      transform: translateY(-8px) scale(0.95);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      min-width: 200px;
    }
    .nav-trigger:hover .nav-panel,
    .nav-trigger.expanded .nav-panel {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .nav-item::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .nav-item:hover::before { opacity: 1; }

    .nav-item.trade-item::before {
      background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(240,180,41,0.08));
    }
    .nav-item.stream-item::before {
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(6,182,212,0.08));
    }

    .nav-item .ni-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .nav-item.trade-item .ni-icon {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.2);
    }
    .nav-item.stream-item .ni-icon {
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.2);
    }

    .nav-item .ni-text {
      position: relative; z-index: 1;
    }
    .nav-item .ni-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3px;
      color: var(--text);
    }
    .nav-item .ni-desc {
      font-size: 10px;
      color: var(--text2);
      margin-top: 1px;
    }

    /* Active indicator */
    .nav-item.active {
      background: rgba(255,255,255,0.04);
    }
    .nav-item.active .ni-indicator {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      width: 6px; height: 6px;
      border-radius: 50%;
      z-index: 1;
    }
    .nav-item.trade-item.active .ni-indicator {
      background: var(--trade-c2);
      box-shadow: 0 0 8px var(--trade-glow);
    }
    .nav-item.stream-item.active .ni-indicator {
      background: var(--stream-c2);
      box-shadow: 0 0 8px var(--stream-glow);
    }

    .nav-divider {
      height: 1px;
      background: var(--border);
      margin: 2px 8px;
    }

    .nav-footer {
      padding: 6px 14px;
      font-size: 9px;
      color: var(--text2);
      text-align: center;
      font-family: 'Syne', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ═══ LOADING ═══ */
    #loader {
      position: fixed; inset: 0; z-index: 999999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s cubic-bezier(0.4,0,0.2,1);
    }
    .loader-ring {
      width: 48px; height: 48px;
      border: 2px solid rgba(255,255,255,0.05);
      border-top: 2px solid var(--trade-c2);
      border-right: 2px solid var(--stream-c1);
      border-radius: 50%;
      animation: loaderSpin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes loaderSpin { 100% { transform: rotate(360deg); } }
    .loader-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      animation: loaderPulse 1.5s ease-in-out infinite;
    }
    @keyframes loaderPulse { 0%,100%{opacity:0.25} 50%{opacity:0.6} }

    /* ═══ KEYBOARD HINT ═══ */
    .kbd-hint {
      position: fixed;
      bottom: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 99998;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 10px;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }
    .kbd-hint.show { opacity: 1; }
    .kbd-hint kbd {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
    }

    /* ═══ RESPONSIVE ═══ */
    @media(max-width:480px) {
      .nav-dot { width: 32px; height: 32px; font-size: 13px; }
      .nav-panel { min-width: 180px; }
      .nav-item { padding: 8px 12px; }
      .nav-item .ni-icon { width: 28px; height: 28px; font-size: 14px; }
      .nav-item .ni-title { font-size: 11px; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-brand">M4DI~UciH4</div>
  </div>

  <!-- Ambient Background -->
  <div class="ambient"></div>

  <!-- Floating Nav (Hover-expand, doesn't block content) -->
  <div class="nav-trigger" id="navTrigger">
    <div class="nav-dot" id="navDot" onclick="toggleNav()">⚡</div>
    <div class="nav-panel" id="navPanel">
      <div class="nav-item trade-item active" id="nav-trading" onclick="setMode('trading')">
        <div class="ni-icon">📈</div>
        <div class="ni-text">
          <div class="ni-title">XAUUSD Pro</div>
          <div class="ni-desc">Scalping Analysis Dashboard</div>
        </div>
        <div class="ni-indicator"></div>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-item stream-item" id="nav-stream" onclick="setMode('stream')">
        <div class="ni-icon">📺</div>
        <div class="ni-text">
          <div class="ni-title">Streamix</div>
          <div class="ni-desc">15K+ Live TV Channels</div>
        </div>
        <div class="ni-indicator"></div>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-footer">Press <kbd style="background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:3px;padding:0 4px;font-weight:600;color:var(--text)">Tab</kbd> to switch</div>
    </div>
  </div>

  <!-- Keyboard Hint (Shows briefly on first load) -->
  <div class="kbd-hint" id="kbdHint">
    💡 Tekan <kbd>Tab</kbd> untuk switch mode · Hover <kbd>⚡</kbd> untuk menu
  </div>

  <!-- Applications -->
  <div class="frame-wrap frame-trading">
    <iframe src="xauusd_pro.html" title="XAUUSD Scalping Pro" id="iframe-trading" onload="frameLoaded()"></iframe>
  </div>
  <div class="frame-wrap frame-stream">
    <iframe src="streamix.html" title="Streamix IPTV" id="iframe-stream" onload="frameLoaded()"></iframe>
  </div>

  <script>
    let loadCount = 0;
    let currentMode = 'trading';

    function frameLoaded() {
      loadCount++;
      if (loadCount >= 2) {
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 700);
        // Show keyboard hint briefly
        setTimeout(() => {
          document.getElementById('kbdHint').classList.add('show');
          setTimeout(() => document.getElementById('kbdHint').classList.remove('show'), 4000);
        }, 1200);
      }
    }

    // Fallback loader dismiss
    setTimeout(() => {
      const loader = document.getElementById('loader');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 700);
      }
    }, 4000);

    function setMode(mode) {
      if (mode === currentMode) return;
      currentMode = mode;

      if (mode === 'stream') {
        document.body.classList.add('mode-stream');
        document.getElementById('nav-trading').classList.remove('active');
        document.getElementById('nav-stream').classList.add('active');
        document.getElementById('navDot').textContent = '📺';
      } else {
        document.body.classList.remove('mode-stream');
        document.getElementById('nav-stream').classList.remove('active');
        document.getElementById('nav-trading').classList.add('active');
        document.getElementById('navDot').textContent = '📈';
      }

      // Auto-collapse nav after selection
      document.getElementById('navTrigger').classList.remove('expanded');
    }

    function toggleNav() {
      document.getElementById('navTrigger').classList.toggle('expanded');
    }

    // Close nav when clicking outside
    document.addEventListener('click', (e) => {
      const trigger = document.getElementById('navTrigger');
      if (!trigger.contains(e.target)) {
        trigger.classList.remove('expanded');
      }
    });

    // Keyboard shortcut: Tab to switch
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        setMode(currentMode === 'trading' ? 'stream' : 'trading');
      }
    });
  </script>
</body>
</html>
